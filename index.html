<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>GlassPad</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="collapsed">
  <div id="notch" title="Click to open · Drag to move · Ctrl+Alt+G">
    <span class="notch-dot"></span>
    <span class="notch-label">GlassPad</span>
    <svg class="notch-chev" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5 L5 6.5 L8 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div id="panel">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="noise"></div>

    <header class="titlebar">
      <div class="lights">
        <button class="light red" id="btnClose" title="Collapse to notch"></button>
        <button class="light yellow" id="btnMin" title="Collapse"></button>
        <button class="light green" id="btnTop" title="Toggle always on top"></button>
      </div>
      <div class="titlewrap">
        <span id="pageTitle" class="page-title">Untitled</span>
        <span id="saveState" class="save-state"></span>
      </div>
      <div class="hdr-actions">
        <button class="icon-btn" id="btnDrawer" title="Pages">
          <svg width="15" height="15" viewBox="0 0 15 15"><path d="M2 3.5h11M2 7.5h11M2 11.5h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="btnSettings" title="Settings">
          <svg width="15" height="15" viewBox="0 0 15 15"><circle cx="7.5" cy="7.5" r="2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M7.5 1.5v2M7.5 11.5v2M1.5 7.5h2M11.5 7.5h2M3.2 3.2l1.4 1.4M10.4 10.4l1.4 1.4M11.8 3.2l-1.4 1.4M4.6 10.4l-1.4 1.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <nav class="segment" id="segment">
      <div class="seg-indicator" id="segIndicator"></div>
      <button class="seg-btn active" data-view="notes">Notes</button>
      <button class="seg-btn" data-view="todos">To-Do</button>
    </nav>

    <main class="content">
      <section id="notesView" class="view active">
        <aside id="drawer" class="drawer">
          <div class="drawer-head">
            <span class="drawer-title">Pages</span>
            <button class="new-page" id="btnNewPage" title="New page">
              <svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              New
            </button>
          </div>
          <div id="pageList" class="page-list"></div>
        </aside>
        <div class="editor">
          <textarea id="noteArea" placeholder="Type anything on your mind&#8230; it saves itself." spellcheck="false"></textarea>
          <footer class="editor-foot">
            <span id="wordCount">0 words</span>
            <span id="pageDate"></span>
          </footer>
        </div>
      </section>

      <section id="todosView" class="view">
        <div class="todo-add">
          <input id="todoInput" type="text" placeholder="Add a task and press Enter" maxlength="200" autocomplete="off" />
          <button id="btnAddTodo" title="Add">
            <svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 2v9M2 6.5h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="todoList" class="todo-list"></div>
        <footer class="todo-foot">
          <span id="todoCount">0 tasks</span>
          <button id="btnClearDone" class="link-btn">Clear done</button>
        </footer>
      </section>
    </main>

    <div id="settingsPop" class="popover hidden">
      <div class="pop-row">
        <span>Launch at startup</span>
        <button class="switch" id="swStartup" role="switch" aria-checked="false"><span class="knob"></span></button>
      </div>
      <div class="pop-row">
        <span>Always on top</span>
        <button class="switch on" id="swOnTop" role="switch" aria-checked="true"><span class="knob"></span></button>
      </div>
      <div class="pop-row">
        <span>Sleep when hidden</span>
        <button class="switch on" id="swSleep" role="switch" aria-checked="true"><span class="knob"></span></button>
      </div>
      <div class="pop-row">
        <span>Low memory mode</span>
        <button class="switch on" id="swLowMem" role="switch" aria-checked="true"><span class="knob"></span></button>
      </div>
      <div class="pop-sep"></div>
      <button class="pop-quit" id="btnQuit">Quit GlassPad</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
